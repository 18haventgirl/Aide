# lg-aide（dev/lg 分支）专用：只负责依赖服务（MySQL + ChromaDB），后端与前端在宿主机上运行。
# 容器与卷名都带 lg-aide 前缀 —— Docker 的容器名/卷名是宿主机全局的，
# 另一个 Aide 工作区也在跑，不加前缀会直接撞名或误用对方的数据卷。
# 端口都刻意避开了另一个实例在用的 8000/8002/3000，也避开了常见的 3306/8000 默认占用：
#   MySQL   宿主 3307 -> 容器 3306
#   Chroma  宿主 8101 -> 容器 8000
# 用法：docker compose up -d，然后按 backend/env.example 保持 DB_PORT=3307 / CHROMA_PORT=8101
services:
  mysql:
    image: mysql:8.4
    container_name: lg-aide-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lg-aide-root
      MYSQL_DATABASE: lg_aide
      MYSQL_USER: lg_aide
      MYSQL_PASSWORD: lg_aide
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - lg-aide-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulg_aide", "-plg_aide"]
      interval: 5s
      timeout: 5s
      retries: 20

  chromadb:
    image: chromadb/chroma:1.0.15
    container_name: lg-aide-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8101:8000"
    volumes:
      - lg-aide-chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lg-aide-mysql-data:
  lg-aide-chroma-data:
